<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<base href="./">
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#3b0f2f" />

<title>Sexy By JennyB — Digital eCard</title>
<meta name="description" content="Sexy By JennyB — Pro Smart Digital eCard" />

<style>
/* =======================
   ELEGANT PINK THEME
======================= */
:root{
  --bgA:#2b0a1f;
  --bgB:#3b0f2f;

  --glass: rgba(255,255,255,.10);
  --glass2: rgba(255,255,255,.06);

  --text:#fff1f7;
  --muted:rgba(255,241,247,.72);

  --accent:#ff6fae;
  --accent2:#ff9ccf;

  --shadow:0 22px 70px rgba(0,0,0,.55);
  --radius:22px;
  --btnH:52px;
  --maxW:880px;
}

/* ===== Base ===== */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 520px at 15% 10%, rgba(255,111,174,.25), transparent 60%),
    radial-gradient(860px 520px at 90% 40%, rgba(255,156,207,.20), transparent 60%),
    linear-gradient(160deg,var(--bgA),var(--bgB));
}

/* ===== Water Glow ===== */
.waterGlow{
  position:fixed;
  inset:-80px;
  background:
    radial-gradient(1200px 640px at 20% 20%, rgba(255,111,174,.18), transparent 60%),
    radial-gradient(900px 520px at 80% 60%, rgba(255,156,207,.14), transparent 60%);
  filter:blur(20px);
  pointer-events:none;
  z-index:0;
}

/* ===== Layout ===== */
.wrap{
  position:relative;
  z-index:1;
  max-width:var(--maxW);
  margin:0 auto;
  padding:26px 16px 40px;
}
.card{
  position:relative;
  border-radius:var(--radius);
  background:linear-gradient(180deg,var(--glass),var(--glass2));
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
  overflow:hidden;
}

/* ===== TOP ZONE + WATERMARK ===== */
.topZone{
  position:relative;
  overflow:hidden;
}
.topZone .wm{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  opacity:.16;
  z-index:0;
}
.topZone .wm img{
  width:120%;
  transform:translateY(10px);
  filter:brightness(1.1) contrast(1.05) grayscale(100%);
}
.topZone > *:not(.wm){
  position:relative;
  z-index:1;
}

/* ===== Brand Bar ===== */
.brandBar{
  padding:18px;
  display:flex;
  justify-content:space-between;
  gap:14px;
}
.brandLeft{
  display:flex;
  gap:12px;
}
.logoBox{
  width:52px;height:52px;
  border-radius:16px;
  background:rgba(0,0,0,.25);
  overflow:hidden;
}
.logoBox img{
  width:100%;height:100%;object-fit:cover;
}
.brandName{
  font-weight:900;
  text-transform:uppercase;
  font-size:13px;
}
.brandTag{
  font-size:12px;
  color:var(--muted);
}
.chip{
  padding:7px 12px;
  border-radius:999px;
  font-size:12px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#2b0a1f;
  font-weight:800;
}

/* ===== Hero ===== */
.hero{
  padding:18px;
  display:flex;
  gap:16px;
}
.avatarRing{
  width:104px;
  height:104px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  flex:0 0 104px;
}

.avatarWrap{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  background:rgba(0,0,0,.22);
}

.avatarWrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position: center 35%;
  display:block;
  border-radius:50%;
}
   
.name{
  font-size:26px;
  margin:0;
}
.role{
  font-weight:700;
  color:var(--muted);
}

/* ===== Info Tiles ===== */
.info{
  padding:18px;
  display:grid;
  gap:12px;
}
.tile{
  display:flex;
  gap:12px;
  padding:14px;
  border-radius:16px;
  background:rgba(0,0,0,.22);
}
.label{
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
}
.value{
  font-weight:800;
}

/* ===== Actions ===== */
.actions{
  padding:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.btn{
  height:var(--btnH);
  border-radius:16px;
  background:rgba(0,0,0,.25);
  color:var(--text);
  font-weight:900;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
}
.btn.main{
  grid-column:1/-1;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#2b0a1f;
}

/* ===== Footer ===== */
footer{
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
}
</style>
</head>

<body data-tier="pro">
<div class="waterGlow"></div>

<!-- TOP ZONE -->

      </div>
    </div>
    <div>
      <h1 class="name">Jenny B</h1>

    </div>
  </section>
</div>

<section class="info">
  <div class="tile">
    <div>
      <div class="label">Call / Text</div>

    </div>
  </div>
  <div class="tile">

    </div>
  </div>
  <div class="tile">

  </div>

<section class="actions">

</main>
</div>
</body>
</html>
